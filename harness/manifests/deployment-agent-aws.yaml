# Agentic testing only, certification-aws only. Runs next to deployment.yaml.
# One replica: each pod runs its own agentic governor, and two would overwrite each other's
# python_storyteller and python_story_critic definitions mid-run.
# Connection details come from the same ConfigMap and Secret as deployment.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-agent-harness-worker
  # namespace: xxxxx # supply this in kubectl command
  labels:
    app: python-agent-harness-worker
spec:
  replicas: 1
  strategy:
    # Stop the old pod before starting the new one, so two governors never overlap.
    type: Recreate
  selector:
    matchLabels:
      app: python-agent-harness-worker
  template:
    metadata:
      labels:
        app: python-agent-harness-worker
    spec:
      containers:
      - name: harness
        image: ghcr.io/conductor-oss/python-sdk/harness-worker:harness-agentic-testing-latest
        imagePullPolicy: Always
        env:
        # === CONDUCTOR CONNECTION (from per-cloud ConfigMap) ===

        - name: CONDUCTOR_SERVER_URL
          valueFrom:
            configMapKeyRef:
              name: python-sdk-harness-config
              key: CONDUCTOR_SERVER_URL

        - name: CONDUCTOR_AUTH_KEY
          valueFrom:
            configMapKeyRef:
              name: python-sdk-harness-config
              key: CONDUCTOR_AUTH_KEY

        - name: CONDUCTOR_AUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: conductor-credentials
              key: auth-secret

        # === AGENTIC TESTING ONLY ===
        - name: HARNESS_SDK_TESTING_ENABLED
          value: "false"

        - name: HARNESS_AGENTIC_TESTING_ENABLED
          value: "true"

        # <AI integration on certification-aws>/<model enabled in it>
        - name: HARNESS_AGENTIC_MODEL
          value: "chatbots/claude-haiku-4-5"

        - name: HARNESS_AGENTIC_INTERVAL_SECONDS
          value: "300"

        # The stop_when worker runs in a spawned child process; without this its
        # progress lines sit in a pipe buffer instead of reaching the pod log.
        - name: PYTHONUNBUFFERED
          value: "1"

        # === METRICS MODE ===
        - name: WORKER_CANONICAL_METRICS
          value: "true"

        ports:
        - name: metrics
          containerPort: 9991
          protocol: TCP

        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"

        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - test -e /proc/1/cmdline
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - test -e /proc/1/cmdline
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

      restartPolicy: Always
